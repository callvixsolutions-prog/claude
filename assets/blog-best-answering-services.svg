<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" role="img" aria-labelledby="t d">
  <title id="t">Comparing pest control answering services</title>
  <desc id="d">An abstract comparison diagram: three labelled columns for human, AI and hybrid answering services, each with a billing note and placeholder rows.</desc>
  <rect width="900" height="506" fill="#f4efe8"/>
  <circle cx="770" cy="70" r="150" fill="#26a8b6" opacity="0.09"/>
  <circle cx="110" cy="450" r="120" fill="#101c4c" opacity="0.05"/>

  <text x="450" y="92" text-anchor="middle" font-family="Sora,Inter,sans-serif" font-size="30" font-weight="700" fill="#101c4c">Comparing answering services</text>
  <text x="450" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#696d7b">Who answers, how it bills, what a month costs</text>

  <g>
    <rect x="60" y="168" width="240" height="268" rx="18" fill="#ffffff" stroke="#e8e1d7" stroke-width="2"/>
    <rect x="60" y="168" width="240" height="7" rx="3.5" fill="#101c4c"/>
    <text x="84" y="222" font-family="Sora,Inter,sans-serif" font-size="23" font-weight="700" fill="#101c4c">Human</text>
    <text x="84" y="256" font-family="Inter,sans-serif" font-size="16" fill="#696d7b">Per minute or per call</text>
    <rect x="84" y="290" width="168" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="84" y="314" width="120" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="84" y="338" width="146" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="84" y="384" width="96" height="28" rx="14" fill="#101c4c" opacity="0.1"/>
  </g>
  <g>
    <rect x="330" y="168" width="240" height="268" rx="18" fill="#ffffff" stroke="#26a8b6" stroke-width="2"/>
    <rect x="330" y="168" width="240" height="7" rx="3.5" fill="#26a8b6"/>
    <text x="354" y="222" font-family="Sora,Inter,sans-serif" font-size="23" font-weight="700" fill="#101c4c">AI</text>
    <text x="354" y="256" font-family="Inter,sans-serif" font-size="16" fill="#696d7b">Per minute, any hour</text>
    <rect x="354" y="290" width="150" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="354" y="314" width="176" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="354" y="338" width="112" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="354" y="384" width="96" height="28" rx="14" fill="#26a8b6" opacity="0.15"/>
  </g>
  <g>
    <rect x="600" y="168" width="240" height="268" rx="18" fill="#ffffff" stroke="#e8e1d7" stroke-width="2"/>
    <rect x="600" y="168" width="240" height="7" rx="3.5" fill="#e0a63c"/>
    <text x="624" y="222" font-family="Sora,Inter,sans-serif" font-size="23" font-weight="700" fill="#101c4c">Hybrid</text>
    <text x="624" y="256" font-family="Inter,sans-serif" font-size="16" fill="#696d7b">AI first, people on hand</text>
    <rect x="624" y="290" width="136" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="624" y="314" width="170" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="624" y="338" width="124" height="10" rx="5" fill="#e8e1d7"/>
    <rect x="624" y="384" width="96" height="28" rx="14" fill="#e0a63c" opacity="0.18"/>
  </g>
</svg>
